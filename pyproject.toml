[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva-device-sdk"
version = "0.1.0"
description = "Lightweight on-device hardware, environment, unified cache and storage foundation for Android Termux & ARM64"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "uno-km (AMEVA Foundation)", email = "zhfldk014745@naver.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/uno-km/ameva-device-sdk"
Repository = "https://github.com/uno-km/ameva-device-sdk"

[tool.setuptools.packages.find]
where = ["src"]
